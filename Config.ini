; SnapPaste 合并版 v1.0 配置 (原一键复制粘贴 v3.0.2 + Snipaste 核心功能) (UTF-8, 兼容原版字段)
; ★ 热键已全部预设好, 不用自己设置, 打开软件就能用:
;   F6=多次复制  F7=顺序粘贴  F8=全部粘贴  F9=删除最后一条  Shift+F9=删除全部  F1=区域截图  F3=贴剪贴板
;   想换键再去软件里「热键设置」, 或改下面 HotKey8-12 后重启软件
; 优化说明: SleepTime 50->80ms 防丢粘贴; AutoRun 默认关
[HotKey]
HotKey0=无
HotKey1=无
HotKey2=无
HotKey3=无
HotKey4=无
HotKey5=无
HotKey6=无
HotKey7=无
HotKey8=F6
HotKey9=F7
HotKey10=F8
HotKey11=F9
HotKey12=SHIFT+F9

; 截图贴图热键 (沿用 Snipaste 习惯, 已预设不用自己设; F1 在别的软件里按会优先截图, 不习惯可在热键设置改成如 Alt+A)
[Snip]
SnipKey=F1
PinKey=F3
UIDetect=2
CopyKey=F5
TransKey=F4
ReplyKey=SHIFT+F4
TransTarget=zh-CN
TransCompare=1
DelayKey=无
ClosePinsKey=无
TogglePinsKey=无
RestorePinKey=无
ClickThroughKey=无
DelaySeconds=3

[Config]
AutoSet=0
AutoRun=0
MiniFormTime=5
MiniFormSet=0
SleepTime=80
SplitPos=0
AddChar=1
LetterSet=0

WaveSet=0
Language=Chinese
PasteEnter=0
PasteRemove=1
ShowHotKey=F2
SearchEngine=google
[Wave]
WaveSet=0
WaveFile=ding.wav

[OCHotKey]
HotKey=
OCAutoSet=0

[Form]
Form1XY=283,219,680,460
Form2XY=314,237,200,277

[Translate]
Service=free
BaiduAppId=
BaiduKey=
YoudaoAppId=
YoudaoSecret=
GoogleKey=

