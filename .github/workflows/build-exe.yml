name: Build SnapPaste EXE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller Pillow keyboard pystray rapidocr-onnxruntime tzdata yt-dlp pywebview
      - name: Slim site-packages (drop unused heavy parts)
        shell: python
        run: |
          import glob, os, shutil, sysconfig
          sp = sysconfig.get_paths()["purelib"]
          def rm(p):
              if os.path.isdir(p): shutil.rmtree(p, ignore_errors=True)
              elif os.path.exists(p): os.remove(p)
          for f in glob.glob(os.path.join(sp, "cv2", "opencv_videoio_ffmpeg*.dll")): rm(f)
          rm(os.path.join(sp, "cv2", "data"))
          for d in glob.glob(os.path.join(sp, "numpy", "**", "tests"), recursive=True): rm(d)
          for sub in ("transformers", "tools", "quantization", "datasets", "backend"):
              rm(os.path.join(sp, "onnxruntime", sub))
          print("slim done")
      - run: pyinstaller --noconfirm --onefile --windowed --name SPST --icon SPST.ico --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all tzdata --collect-all yt_dlp --collect-all webview --add-data "Config.ini;." --add-data "ding.wav;." --add-data "Chinese.ini;Language" --add-data "English.ini;Language" main.py --exclude-module matplotlib --exclude-module pandas --exclude-module scipy
      - uses: actions/upload-artifact@v4
        with:
          name: SnapPaste-Windows
          path: dist/SPST.exe
      - name: Publish release v1.4.20
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' 'SPST v1.4.20 首个云端打包版本（GitHub Actions 构建）。' '下载 SPST.exe 双击即可运行，无需安装 Python。' '首次打开若弹出 SmartScreen，点「更多信息 → 仍要运行」。' '功能：F1 截图（标注/OCR/扫码）、F3 贴图、F6/F7/F8 文字复制队列，热键全部预设。' > notes.txt
          gh release create v1.4.20 dist/SPST.exe --title "SPST v1.4.20" --notes-file notes.txt || gh release upload v1.4.20 dist/SPST.exe --clobber
